version: '3.8'

services:
  finance-app:
    image: python-superset-etl:latest
    pull_policy: never
    container_name: finance_tracker  # Keep only one container_name
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - APP_ENV=docker  # Overrides the .env file to signify Docker environment
    volumes:
      - .:/app
    networks:
      - superset-network
    restart: unless-stopped

networks:
  superset-network:
    external: true